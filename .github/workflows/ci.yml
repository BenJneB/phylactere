name: CI

# Uniquement sur les pull requests vers main ou dev, et à la demande (voir docs/SPEC.md, section 7.2).
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Serveur (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Garde-fou : un job bloqué est arrêté au lieu d'attendre 6 h (limite par défaut de GitHub).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    env:
      # Modèles PaddleOCR, mis en cache entre deux exécutions (tests @pytest.mark.ocr)
      PADDLE_PDX_CACHE_HOME: ${{ github.workspace }}/.paddlex-cache
    steps:
      - uses: actions/checkout@v4

      - name: Cache des modèles OCR
        uses: actions/cache@v4
        with:
          path: .paddlex-cache
          # Les noms des modèles sont dans config.example.toml
          key: paddlex-${{ runner.os }}-${{ hashFiles('server/config.example.toml', 'server/uv.lock') }}
          restore-keys: paddlex-${{ runner.os }}-

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Dépendances
        run: uv sync --locked --extra cpu

      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Tests (OCR réel compris)
        run: uv run --no-sync pytest

      - name: Vérification de l'OCR (python -m phylactere --check-ocr)
        env:
          PHYLACTERE_CONFIG_DIR: ${{ runner.temp }}/phylactere-check
        run: uv run --no-sync python -m phylactere --check-ocr

      - name: Syntaxe des scripts PowerShell (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: scripts
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$($file.Name):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Fumée via start.sh
        if: runner.os == 'Linux'
        working-directory: .
        env:
          PHYLACTERE_CONFIG_DIR: ${{ runner.temp }}/phylactere
        # Le serveur doit être arrêté à la fin de l'étape : sinon « uv run » garde son verrou
        # sur le cache et le nettoyage de setup-uv (uv cache prune) attend 5 min puis échoue.
        run: |
          scripts/start.sh --port 8765 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/health

      - name: Fumée via start.ps1
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        env:
          PHYLACTERE_CONFIG_DIR: ${{ runner.temp }}\phylactere
        # Même raison que pour start.sh : on arrête tout l'arbre (powershell → uv → python).
        run: |
          $server = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts\start.ps1', '--port', '8765'
          $ok = $false
          try {
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              try { Invoke-RestMethod http://127.0.0.1:8765/health | ConvertTo-Json; $ok = $true } catch { Start-Sleep -Seconds 1 }
            }
          }
          finally {
            & taskkill /PID $server.Id /T /F | Out-Null
          }
          if (-not $ok) { Write-Host 'Le serveur ne répond pas sur /health.'; exit 1 }
