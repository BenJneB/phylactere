name: CI

# Uniquement sur les pull requests vers main ou dev, et à la demande (voir docs/SPEC.md, section 7.2).
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Serveur (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Dépendances
        run: uv sync --locked --extra cpu

      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Tests
        run: uv run --no-sync pytest

      - name: Syntaxe des scripts PowerShell (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: scripts
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$($file.Name):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Fumée via start.sh
        if: runner.os == 'Linux'
        working-directory: .
        env:
          PHYLACTERE_CONFIG_DIR: ${{ runner.temp }}/phylactere
        run: |
          scripts/start.sh --port 8765 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/health

      - name: Fumée via start.ps1
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: .
        env:
          PHYLACTERE_CONFIG_DIR: ${{ runner.temp }}\phylactere
        run: |
          Start-Process powershell -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts\start.ps1', '--port', '8765'
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/health | ConvertTo-Json; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          Write-Host 'Le serveur ne répond pas sur /health.'
          exit 1
