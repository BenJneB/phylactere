[project]
name = "phylactere"
version = "0.1.0"
description = "Serveur local de traduction des webtoons de comic.naver.com (OCR + LLM local)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    # Sans [standard] : cet extra installerait uvloop, exclu (voir SPEC 7.1).
    "uvicorn>=0.32",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "tomlkit>=0.13",
    # OCR. PaddlePaddle (le moteur de calcul) vient des extras cpu / gpu ci-dessous.
    "paddleocr>=3.7,<3.8",
    "pillow>=11",
    # Envoi de fichier à /debug/ocr (multipart/form-data)
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Un seul des deux extras à la fois (voir [tool.uv] conflicts).
cpu = ["paddlepaddle==3.3.1"]
# Variante CUDA 12.6 : demande un pilote NVIDIA qui supporte CUDA >= 12.6.
# Les bibliothèques CUDA arrivent en paquets pip : pas de CUDA Toolkit à installer.
gpu = [
    "paddlepaddle-gpu==3.3.1",
    # uv lit les dépendances dans la wheel Linux, où les bibliothèques CUDA sont réservées
    # à Linux ; la wheel Windows les demande aussi. On les déclare donc pour Windows
    # (versions résolues pour paddlepaddle-gpu 3.3.1 cu126 / win_amd64).
    "nvidia-cuda-runtime-cu12==12.6.77; sys_platform == 'win32'",
    # 9.9 et non 9.5 (demandée par la wheel) : Paddle 3.3.1 est compilé avec cuDNN 9.9
    # et avertit d'une incompatibilité possible avec une version plus ancienne.
    "nvidia-cudnn-cu12==9.9.0.52; sys_platform == 'win32'",
    "nvidia-cufft-cu12==11.3.0.4; sys_platform == 'win32'",
    "nvidia-curand-cu12==10.3.7.77; sys_platform == 'win32'",
    "nvidia-cusolver-cu12==11.7.1.2; sys_platform == 'win32'",
    "nvidia-cusparse-cu12==12.5.4.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
# Utilisé uniquement pour les paquets qui le désignent explicitement (paddlepaddle-gpu).
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: lance le vrai serveur dans un sous-processus",
    "ocr: charge PaddleOCR (à partir du jalon 2)",
]
