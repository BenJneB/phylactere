# Surcharges pour le développement sur Ubuntu.
# Utilisé via PHYLACTERE_CONFIG (scripts/start.sh le positionne automatiquement).
# Ne contient que les valeurs à changer, et jamais de jeton : le jeton reste
# dans le config.toml du dossier utilisateur.

[server]
log_level = "debug"

[ollama]
# La machine de dev n'a pas de GPU : modèle plus petit que le défaut (qwen3.5:9b).
# qwen3:1.7b ne traduit pas : il romanise le coréen. Installation : ollama pull qwen3.5:4b
model = "qwen3.5:4b"

[glossary]
# Sur CPU, qwen3.5:4b lit le prompt à ~10 jetons/s : 200 bulles (~6 000 jetons) prendraient
# plus de dix minutes. Moins de bulles et un délai plus long.
suggest_bubbles = 80
timeout_s = 1800

[summary]
# Sur CPU, ~10 jetons/s à la lecture du prompt : un épisode (~1 000 jetons) prend quelques
# minutes.
timeout_s = 1800

[ocr]
device = "cpu"
