# Configuration de Phylactère : valeurs par défaut (ne pas modifier ce fichier).
#
# Les réglages personnels vont dans le fichier utilisateur, créé au premier lancement
# avec seulement le jeton :
#   Windows : %LOCALAPPDATA%\phylactere\config.toml
#   Linux   : ~/.config/phylactere/config.toml
# N'y écrire que les valeurs à changer, dans leur section ; les autres viennent d'ici.

[server]
# Le serveur écoute toujours sur 127.0.0.1 ; seul le port est réglable.
port = 8765
# Jeton à saisir dans le popup de l'extension (en-tête X-Phylactere-Token).
# Laisser vide : il est généré au premier lancement.
token = ""
# critical, error, warning, info ou debug
log_level = "info"

[ollama]
url = "http://127.0.0.1:11434"
# Choisi au jalon 5 en lecture réelle (voir README, « Modèle de traduction »).
# Si la traduction est lente (carte de moins de 8 Go, mémoire vidéo saturée) :
# "qwen3.5:4b", plus rapide mais moins bon. Le popup de l'extension permet aussi d'en changer.
# Le modèle doit être installé : ollama pull <modèle>
model = "qwen3.5:9b"
# Durée pendant laquelle Ollama garde le modèle en mémoire après une requête
keep_alive = "30m"
# Délai maximal d'une requête (le premier chargement du modèle peut être long)
timeout_s = 180

[translation]
# Langue cible par défaut (code ISO 639-1, ex. "fr", "en")
target_lang = "fr"
# Nombre de bulles déjà traduites de l'épisode données au modèle comme contexte
context_size = 15
# 0 = déterministe ; un peu de variété rend le texte plus naturel
temperature = 0.2

[glossary]
# Propositions d'entrées de glossaire (page « Glossaire » de l'extension) : nombre maximal
# de bulles déjà traduites de la série envoyées au modèle, en partant de l'épisode ouvert
suggest_bubbles = 200
# Taille du contexte Ollama (jetons) pour cette requête, bien plus longue qu'une
# traduction : 200 bulles dépassent les 4096 jetons qu'Ollama alloue par défaut aux petites
# cartes, et le texte en trop serait coupé sans erreur. 0 = valeur par défaut d'Ollama.
num_ctx = 16384
# Délai d'attente d'Ollama (secondes) pour cette requête : elle lit toutes les bulles d'un
# coup, bien plus longue qu'une traduction (timeout_s de [ollama]). Sur GPU, moins d'une
# minute ; sur CPU, comptez une dizaine de secondes par tranche de 100 jetons du prompt.
timeout_s = 600

[ocr]
# "auto" (GPU si PaddlePaddle GPU est installé et qu'une carte NVIDIA répond, sinon CPU),
# "gpu" ou "cpu"
device = "auto"
# Modèles PaddleOCR. La reconnaissance doit être un modèle coréen (korean_*) :
# les modèles par défaut de PaddleOCR ne lisent pas le coréen.
detection_model = "PP-OCRv5_mobile_det"
recognition_model = "korean_PP-OCRv5_mobile_rec"
# Lignes ignorées sous ce score de confiance (0 à 1)
min_confidence = 0.5
# Les images hautes sont découpées en tranches qui se chevauchent (en pixels)
slice_height = 1200
slice_overlap = 120
# Deux lignes vues dans deux tranches sont des doublons au-delà de ce recouvrement (0 à 1)
dedup_overlap = 0.5
# Une bulle à moins de cette distance (px) du bord haut ou bas est signalée
# comme possiblement coupée entre deux images
edge_margin = 8
# Hauteur (px) prise sur les images voisines, pour lire en entier les bulles
# coupées entre deux images
neighbor_margin = 400
# Couleur du fond posé sous la traduction, prise autour du texte d'origine (hors texte),
# dans la boîte de la bulle élargie de bg_margin px
bg_margin = 6
# Part minimale (0 à 1) des pixels de la couleur dominante ; en dessous (fond dessiné
# ou dégradé), la traduction garde un fond blanc
bg_min_share = 0.6
# Part minimale (0 à 1) d'une couleur entre les lettres (dans les boîtes des lignes) pour
# l'emporter sur la marge : cartouche ajusté au texte (texte blanc sur bandeau noir).
# Le texte couvre 35 à 58 % de la boîte d'une ligne : ne pas descendre sous 0,65
bg_text_share = 0.7

[grouping]
# Écart vertical maximal entre deux lignes d'une même bulle, en hauteurs de ligne médianes
max_vertical_gap = 0.8
# Recouvrement horizontal minimal, en fraction de la ligne la plus étroite...
min_horizontal_overlap = 0.3
# ...ou écart maximal entre les centres, en fraction de la ligne la plus étroite
max_center_offset = 0.6

[cache]
# Fichier SQLite du cache ; vide = dossier de cache de l'utilisateur
# (Windows : %LOCALAPPDATA%\phylactere\Cache\cache.sqlite3)
path = ""

[fetch]
# Seuls ces hôtes sont autorisés (HTTPS uniquement)
allowed_hosts = ["image-comic.pstatic.net"]
max_bytes = 20_000_000
timeout_s = 15
